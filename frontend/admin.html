<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FF006B">
  <meta name="description" content="Eurovision voting app - Score and rank your favorite songs">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eurovision">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="manifest" href="manifest.json">
  <title>Admin - Eurovision 🎵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menuContainer"></div>

  <div class="container">

    <div class="content">
      <div id="adminPanel"></div>

      <div id="songsUpdatePanel" style="margin-bottom: 30px; display: none;">
        <button onclick="updateSongs()" class="btn">🔄 Hent sanger fra Wikipedia</button>
        <div id="songsUpdateResult" style="margin-top: 10px; color: white;"></div>
      </div>

      <div id="imageUpdatePanel" style="margin-bottom: 30px; display: none;">
        <h3 style="color: white; margin-bottom: 15px;">Oppdater bildene</h3>
        <textarea id="imageData" placeholder="Land&#9;Bilde-URL&#10;Norge&#9;https://...&#10;Sverige&#9;https://..." style="width: 100%; height: 150px; padding: 10px; border-radius: 8px; font-family: monospace;"></textarea>
        <button onclick="updateImages()" class="btn" style="margin-top: 10px;">Oppdater bilder</button>
        <div id="updateResult" style="margin-top: 10px; color: white;"></div>
      </div>

      <div id="songsList"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const session = getSession();

    // Check if admin
    if (session.name !== 'Inge') {
      showMessage('Kun admin kan få tilgang', 'error');
      setTimeout(() => window.location.href = 'index.html', 2000);
    }

    let songs = [];

    async function loadSongs() {
      try {
        songs = await apiCall('/songs');
        const data = await apiCall('/results');
        renderAdminPanel(data.resultsLocked);
        renderSongs();
      } catch (error) {
        showMessage(`Feil: ${error.message}`, 'error');
      }
    }

    function renderAdminPanel(resultsLocked) {
      const panel = document.getElementById('adminPanel');
      const buttonText = resultsLocked ? '🔓 Åpne avstemningen' : '🔒 Lukk avstemningen';
      panel.innerHTML = `
        <div class="admin-panel" style="margin-bottom: 20px;">
          <button onclick="toggleResults()">${buttonText}</button>
        </div>
      `;

      // Show update panels
      document.getElementById('songsUpdatePanel').style.display = 'block';
      document.getElementById('imageUpdatePanel').style.display = 'block';

      // Load images.txt content
      loadImageFile();
    }

    async function loadImageFile() {
      try {
        const result = await apiCall('/admin/images-file', 'GET');
        document.getElementById('imageData').value = result.content;
      } catch (error) {
        console.log('images.txt not found or error:', error.message);
      }
    }

    async function toggleResults() {
      const panel = document.getElementById('adminPanel');
      const button = panel.querySelector('button');
      const isCurrentlylocked = button.textContent.includes('Åpne');

      if (!confirm(isCurrentlylocked ? 'Åpne avstemningen?' : 'Lukke avstemningen?')) return;

      try {
        await apiCall('/admin/lock-results', 'POST', { name: session.name });
        showMessage(isCurrentlylocked ? 'Avstemningen er åpnet!' : 'Avstemningen er lukket!', 'success');
        setTimeout(() => loadSongs(), 1000);
      } catch (error) {
        showMessage(`Feil: ${error.message}`, 'error');
      }
    }

    function renderSongs() {
      const listDiv = document.getElementById('songsList');
      listDiv.innerHTML = '';

      songs.forEach(song => {
        const card = document.createElement('div');
        card.className = 'song-card';
        card.innerHTML = `
          <div class="song-header">
            <img id="img-${song.id}" src="${song.imageUrl}" alt="${song.country}" class="song-image" style="cursor: pointer;">
            <div class="song-meta" style="flex: 1;">
              <h3>#${song.number} - ${song.country}</h3>
              <p><strong>${song.artist}</strong></p>
              <p>${song.title}</p>
              <button class="btn btn-secondary" onclick="editSong(${song.id})">Rediger</button>
            </div>
          </div>

          <div id="edit-form-${song.id}" style="display: none; padding-top: 15px; border-top: 1px solid #ddd;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
              <div class="form-group">
                <label>Land:</label>
                <input type="text" class="country-input" data-id="${song.id}" value="${song.country}">
              </div>
              <div class="form-group">
                <label>Artist:</label>
                <input type="text" class="artist-input" data-id="${song.id}" value="${song.artist}">
              </div>
              <div class="form-group">
                <label>Sang:</label>
                <input type="text" class="title-input" data-id="${song.id}" value="${song.title}">
              </div>
              <div class="form-group">
                <label>Bilde URL:</label>
                <input type="text" class="imageurl-input" data-id="${song.id}" value="${song.imageUrl}" placeholder="https://...">
              </div>
            </div>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
              <button class="btn" onclick="saveSong(${song.id})">Lagre</button>
              <button class="btn btn-secondary" onclick="cancelEdit(${song.id})">Avbryt</button>
            </div>
          </div>
        `;

        listDiv.appendChild(card);
      });
    }

    function editSong(songId) {
      document.getElementById(`edit-form-${songId}`).style.display = 'block';
    }

    function cancelEdit(songId) {
      document.getElementById(`edit-form-${songId}`).style.display = 'none';
    }

    async function saveSong(songId) {
      const country = document.querySelector(`.country-input[data-id="${songId}"]`).value;
      const artist = document.querySelector(`.artist-input[data-id="${songId}"]`).value;
      const title = document.querySelector(`.title-input[data-id="${songId}"]`).value;
      const imageUrl = document.querySelector(`.imageurl-input[data-id="${songId}"]`).value;

      try {
        await apiCall(`/admin/songs/${songId}`, 'PUT', {
          name: session.name,
          country,
          artist,
          title,
          imageUrl
        });

        // Update local data
        const song = songs.find(s => s.id === songId);
        if (song) {
          song.country = country;
          song.artist = artist;
          song.title = title;
          song.imageUrl = imageUrl;
        }

        // Update image preview
        document.getElementById(`img-${songId}`).src = imageUrl;

        showMessage('Sang oppdatert!', 'success');
        cancelEdit(songId);
      } catch (error) {
        showMessage(`Feil: ${error.message}`, 'error');
      }
    }

    async function updateSongs() {
      const resultDiv = document.getElementById('songsUpdateResult');
      const btn = event.target;
      const originalText = btn.textContent;
      btn.textContent = '⏳ Henter...';
      btn.disabled = true;

      try {
        const result = await apiCall('/admin/update-songs', 'POST', {
          name: session.name
        });

        resultDiv.innerHTML = `✓ Oppdatert ${result.inserted} sanger fra Wikipedia`;
        showMessage('Sanger oppdatert!', 'success');
        setTimeout(() => loadSongs(), 1000);
      } catch (error) {
        resultDiv.textContent = `❌ Feil: ${error.message}`;
      } finally {
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }

    async function updateImages() {
      const textarea = document.getElementById('imageData');
      const resultDiv = document.getElementById('updateResult');
      const lines = textarea.value.trim().split('\n').filter(line => line.trim());

      const imageUpdates = {};
      for (const line of lines) {
        const parts = line.split('\t');
        if (parts.length >= 2) {
          const country = parts[0].trim();
          const imageUrl = parts[1].trim();
          imageUpdates[country] = imageUrl;
        }
      }

      if (Object.keys(imageUpdates).length === 0) {
        resultDiv.textContent = '❌ Ingen data å oppdatere';
        return;
      }

      try {
        const result = await apiCall('/admin/update-images', 'POST', {
          name: session.name,
          imageUpdates
        });

        resultDiv.innerHTML = `✓ Oppdatert ${result.updated} sanger${result.notFound > 0 ? `, ${result.notFound} ikke funnet` : ''}`;
        showMessage('Bilder oppdatert!', 'success');
        setTimeout(() => loadSongs(), 1000);
      } catch (error) {
        resultDiv.textContent = `❌ Feil: ${error.message}`;
      }
    }

    function logout() {
      clearSession();
      window.location.href = 'index.html';
    }

    loadSongs();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FF006B">
  <meta name="description" content="Eurovision voting app - Score and rank your favorite songs">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eurovision">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="manifest" href="manifest.json">
  <title>Eurovision 🎵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="landing-page">
      <div class="landing-logo">
        <img src="logo.svg" alt="Eurovision" class="landing-heart">
      </div>

      <h1 class="landing-title">Eurovision 2026</h1>

      <form id="loginForm" class="landing-form">
        <input type="text" id="name" required placeholder="Skriv ditt navn..." class="landing-input">
        <button type="submit" class="landing-btn">Start</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Check if already logged in
    if (localStorage.getItem('sessionId')) {
      window.location.href = 'songs.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();

      try {
        const result = await apiCall('/users', 'POST', { name });
        if (!result || !result.sessionId) {
          throw new Error('Ingen sessionId mottatt fra server');
        }
        setSession(name, result.sessionId);
        window.location.href = 'songs.html';
      } catch (error) {
        showMessage(`Feil: ${error.message}`, 'error');
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FF006B">
  <meta name="description" content="Eurovision voting app - Score and rank your favorite songs">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eurovision">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="manifest" href="manifest.json">
  <title>Mine poeng - Eurovision 🎵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menuContainer"></div>

  <div class="container">
    <div class="content">
      <div id="rankingList" class="my-points-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.href = 'index.html';
    }

    const session = getSession();
    let songs = [];
    let ratings = {};

    async function loadData() {
      try {
        songs = await apiCall('/songs');

        const myRatings = await apiCall(`/my-ratings?sessionId=${session.sessionId}`);
        myRatings.forEach(r => {
          ratings[r.songId] = {
            score: r.score,
            notes: r.notes || ''
          };
        });

        renderRanking();
      } catch (error) {
        showMessage(`Feil: ${error.message}`, 'error');
      }
    }

    function renderRanking() {
      const list = document.getElementById('rankingList');
      list.innerHTML = '';

      // Sort by rating (highest first), unrated as neutral (5/10)
      const sorted = songs.sort((a, b) => {
        const scoreA = ratings[a.id]?.score ?? 5;
        const scoreB = ratings[b.id]?.score ?? 5;
        return scoreB - scoreA;
      });

      sorted.forEach((song, idx) => {
        const rating = ratings[song.id];
        const score = rating?.score ?? 5;
        const notes = rating?.notes ?? '';
        const points = idx < 10 ? POINTS_ARRAY[idx] : 0;

        const item = document.createElement('div');
        item.className = `my-points-item ${idx < 10 ? 'top-10' : ''}`;
        item.dataset.songId = song.id;
        item.dataset.rank = idx + 1;

        const notesHtml = notes ? `<div class="notes-bubble">${notes}</div>` : '';
        const pointsHtml = points > 0 ? `<div class="points-display">${points}p</div>` : '';

        item.innerHTML = `
          <span class="song-country">${song.country}</span>
          ${notesHtml}
          ${pointsHtml}
        `;

        list.appendChild(item);
      });

      setupDragDrop('.my-points-list', '.my-points-item');

      // Auto-save after drag-and-drop
      document.getElementById('rankingList').addEventListener('dragend', saveDragOrder);
    }

    async function saveDragOrder() {
      const list = document.getElementById('rankingList');
      const rankedIds = Array.from(list.querySelectorAll('.my-points-item'))
        .map(el => parseInt(el.dataset.songId));

      try {
        await apiCall('/rankings', 'POST', {
          sessionId: session.sessionId,
          rankedSongIds: rankedIds
        });
      } catch (error) {
        showMessage(`Feil ved lagring: ${error.message}`, 'error');
      }
    }

    function logout() {
      clearSession();
      window.location.href = 'index.html';
    }

    loadData();
  </script>
</body>
</html>

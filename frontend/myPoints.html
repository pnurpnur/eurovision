<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FF006B">
  <meta name="description" content="Eurovision voting app - Score and rank your favorite songs">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eurovision">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="manifest" href="manifest.json">
  <title>Mine poeng - Eurovision 🎵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menuContainer"></div>

  <div class="container">
    <div class="content">
      <div id="rankingList" class="my-points-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.href = 'index.html';
    }

    const session = getSession();
    let songs = [];
    let ratings = {};
    let resultsLocked = false;
    let savedRanking = null;

    async function loadData() {
      try {
        songs = await apiCall('/songs');

        const myRatings = await apiCall(`/my-ratings?sessionId=${session.sessionId}`);
        myRatings.forEach(r => {
          ratings[r.songId] = {
            score: r.score,
            notes: r.notes || ''
          };
        });

        const myRanking = await apiCall(`/my-ranking?sessionId=${session.sessionId}`);
        savedRanking = myRanking;

        const results = await apiCall('/results');
        resultsLocked = results.resultsLocked;

        renderRanking();

        if (resultsLocked) {
          showMessage('Avstemningen er lukket', 'info');
        }
      } catch (error) {
        showMessage(`Feil: ${error.message}`, 'error');
      }
    }

    function renderRanking() {
      const list = document.getElementById('rankingList');
      list.innerHTML = '';

      // Use saved ranking if available, otherwise sort by rating
      let sorted = songs;
      if (savedRanking && savedRanking.length > 0) {
        const rankingMap = {};
        savedRanking.forEach((id, idx) => {
          rankingMap[id] = idx;
        });
        sorted = songs.sort((a, b) => {
          const rankA = rankingMap[a.id] ?? songs.length;
          const rankB = rankingMap[b.id] ?? songs.length;
          return rankA - rankB;
        });
      } else {
        // Fall back to sorting by rating if no saved ranking
        sorted = songs.sort((a, b) => {
          const scoreA = ratings[a.id]?.score ?? 5;
          const scoreB = ratings[b.id]?.score ?? 5;
          return scoreB - scoreA;
        });
      }

      sorted.forEach((song, idx) => {
        const rating = ratings[song.id];
        const score = rating?.score ?? 5;
        const notes = rating?.notes ?? '';
        const points = idx < 10 ? POINTS_ARRAY[idx] : 0;

        const item = document.createElement('div');
        item.className = `my-points-item ${idx < 10 ? 'top-10' : ''}`;
        item.dataset.songId = song.id;
        item.dataset.rank = idx + 1;

        const notesHtml = notes ? `<div class="notes-bubble">${notes}</div>` : '';
        const pointsHtml = points > 0 ? `<div class="points-display">${points}p</div>` : '';

        item.innerHTML = `
          <span class="song-country">${song.country}</span>
          ${notesHtml}
          ${pointsHtml}
        `;

        list.appendChild(item);
      });

      if (!resultsLocked) {
        setupDragDrop('.my-points-list', '.my-points-item');
        // Auto-save after drag-and-drop
        document.getElementById('rankingList').addEventListener('dragend', saveDragOrder);
      }
    }

    async function saveDragOrder() {
      if (resultsLocked) {
        showMessage('Avstemningen er lukket, kan ikke lagre endringer', 'error');
        return;
      }

      const list = document.getElementById('rankingList');
      const items = Array.from(list.querySelectorAll('.my-points-item'));

      // Update points display and top-10 class based on new order
      items.forEach((item, idx) => {
        const points = idx < 10 ? POINTS_ARRAY[idx] : 0;
        let pointsEl = item.querySelector('.points-display');

        if (points > 0) {
          if (!pointsEl) {
            pointsEl = document.createElement('div');
            pointsEl.className = 'points-display';
            item.appendChild(pointsEl);
          }
          pointsEl.textContent = `${points}p`;
        } else if (pointsEl) {
          pointsEl.remove();
        }

        item.classList.toggle('top-10', idx < 10);
      });

      const rankedIds = items.map(el => parseInt(el.dataset.songId));

      try {
        await apiCall('/rankings', 'POST', {
          sessionId: session.sessionId,
          rankedSongIds: rankedIds
        });
      } catch (error) {
        showMessage(`Feil ved lagring: ${error.message}`, 'error');
      }
    }

    function logout() {
      clearSession();
      window.location.href = 'index.html';
    }

    loadData();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eurovision 2026 - QR Kode</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Neulis Neue", system-ui, sans-serif;
      background: white;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .a4-container {
      width: 210mm;
      height: 297mm;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a4d 50%, #0f0f2e 100%);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      border-radius: 0;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .header {
      text-align: center;
      color: white;
    }

    .header h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .header p {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.8);
    }

    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }

    #qrcode {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .footer {
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
    }

    .url {
      color: oklch(61.3% .2412 13.09);
      font-weight: 700;
      word-break: break-all;
      margin-top: 10px;
      font-size: 14px;
    }

    @media print {
      body {
        padding: 0;
        background: white;
      }

      .a4-container {
        width: 210mm;
        height: 297mm;
        margin: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="a4-container">
    <div class="header">
      <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00A8E8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FF006B;stop-opacity:1" />
          </linearGradient>
        </defs>
        <path d="M50 85 C20 70, 5 55, 5 40 C5 25, 15 15, 25 15 C35 15, 45 25, 50 35 C55 25, 65 15, 75 15 C85 15, 95 25, 95 40 C95 55, 80 70, 50 85 Z" fill="url(#heartGradient)"/>
      </svg>
      <h1>Eurovision 2026</h1>
      <p>Stem på dine favorittlåter</p>
    </div>

    <div id="qrcode"></div>

    <div class="footer">
      <p>Åpne koden med kameraet ditt</p>
      <div class="url">grandprix.up.railway.app</div>
    </div>
  </div>

  <script>
    const url = 'https://grandprix.up.railway.app/';
    new QRCode(document.getElementById('qrcode'), {
      text: url,
      width: 250,
      height: 250,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultat - Eurovision 🎵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎵 Eurovision - Resultat</h1>
      <div class="user-info">
        <span id="userName"></span>
        <button onclick="logout()">Logg ut</button>
      </div>
    </header>

    <nav>
      <a href="songs.html">Sangene</a>
      <a href="myPoints.html">Mine poeng</a>
      <a href="results.html" class="active">Resultat</a>
    </nav>

    <div class="content">
      <div id="adminPanel"></div>

      <h2 id="resultTitle">Samlet resultat fra alle deltakere</h2>
      <table class="results-table">
        <thead>
          <tr>
            <th>Rang</th>
            <th>Land</th>
            <th>Artist</th>
            <th>Sang</th>
            <th>Poeng</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>

      <div id="lockedMessage" style="display: none; padding: 20px; background: #f8d7da; border: 1px solid #f5c6cb; border-radius: 6px; color: #721c24; text-align: center; font-weight: bold;">
        ✓ Resultatene er lukket!
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.href = 'index.html';
    }

    const session = getSession();
    document.getElementById('userName').textContent = `Hei, ${session.name}!`;

    async function loadResults() {
      try {
        const data = await apiCall('/results');
        const { results, resultsLocked } = data;

        renderAdminPanel();
        renderResults(results, resultsLocked);
      } catch (error) {
        showMessage(`Feil: ${error.message}`, 'error');
      }
    }

    function renderAdminPanel() {
      const panel = document.getElementById('adminPanel');

      if (session.name === 'Inge') {
        panel.innerHTML = `
          <div class="admin-panel">
            <h3>Admin-panel</h3>
            <p>Du kan lukke avstemningen når alle har stemt.</p>
            <button onclick="lockResults()">Lukk avstemningen</button>
          </div>
        `;
      }
    }

    function renderResults(results, resultsLocked) {
      const body = document.getElementById('resultsBody');
      body.innerHTML = '';

      if (resultsLocked) {
        document.getElementById('resultTitle').style.display = 'none';
        document.getElementById('resultsBody').parentElement.style.display = 'none';
        document.getElementById('lockedMessage').style.display = 'block';
        return;
      }

      if (results.length === 0) {
        body.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 30px;">Ingen resultater ennå</td></tr>';
        return;
      }

      results.forEach((result, idx) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td style="font-weight: bold; color: #667eea;">#${idx + 1}</td>
          <td>${result.country}</td>
          <td>${result.artist}</td>
          <td>${result.title}</td>
          <td style="font-weight: bold; font-size: 18px;">${result.points}</td>
        `;
        body.appendChild(row);
      });
    }

    async function lockResults() {
      if (!confirm('Er du sikker på at du vil lukke avstemningen? Dette kan ikke angres.')) {
        return;
      }

      try {
        await apiCall('/admin/lock-results', 'POST', { name: session.name });
        showMessage('Avstemningen er lukket!', 'success');
        setTimeout(() => loadResults(), 1000);
      } catch (error) {
        showMessage(`Feil: ${error.message}`, 'error');
      }
    }

    function logout() {
      clearSession();
      window.location.href = 'index.html';
    }

    // Reload every 5 seconds
    loadResults();
    setInterval(loadResults, 5000);
  </script>
</body>
</html>

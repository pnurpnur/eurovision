<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FF006B">
  <meta name="description" content="Eurovision voting app - Score and rank your favorite songs">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eurovision">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="manifest" href="manifest.json">
  <title>Resultat - Eurovision 🎵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menuContainer"></div>

  <div class="container">
    <div class="content">
      <div id="adminPanel"></div>
      <div id="resultsList" class="results-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.href = 'index.html';
    }

    const session = getSession();

    async function loadResults() {
      try {
        const data = await apiCall('/results');
        renderAdminPanel();
        renderResults(data.results, data.resultsLocked);
      } catch (error) {
        showMessage(`Feil: ${error.message}`, 'error');
      }
    }

    function renderAdminPanel() {
      const panel = document.getElementById('adminPanel');
      panel.innerHTML = '';
    }

    function renderResults(results, resultsLocked) {
      const list = document.getElementById('resultsList');
      list.innerHTML = '';

      if (!resultsLocked) {
        list.innerHTML = '<p style="color: white; text-align: center; padding: 40px;">Avstemningen er åpen</p>';
        return;
      }

      if (!results || results.length === 0) {
        list.innerHTML = '<p style="color: rgba(255,255,255,0.6); text-align: center; padding: 40px;">Ingen resultater ennå</p>';
        return;
      }

      results.forEach((result, idx) => {
        const row = document.createElement('div');
        row.className = 'result-row';
        const voters = result.voters || [];
        console.log(`${result.country} voters:`, voters);

        const votersHtml = voters.length > 0
          ? voters.map(v => `
              <div class="voter-row">
                <span class="voter-name">${v.name}</span>
                <span class="voter-points">${v.points}p</span>
              </div>`).join('')
          : `<div class="voter-row"><span class="voter-name" style="opacity:0.5">Ingen har stemt ennå</span></div>`;

        row.innerHTML = `
          <div class="result-main" onclick="toggleVoters(this)">
            <span class="result-place">${idx + 1}</span>
            <span class="result-country">${result.country}</span>
            <span class="result-points">${result.points}p</span>
          </div>
          <div class="result-voters" style="display: none;">
            ${votersHtml}
          </div>
        `;

        list.appendChild(row);
      });
    }

    function toggleVoters(el) {
      const voters = el.nextElementSibling;
      const isOpen = voters.style.display !== 'none';

      if (!isOpen) {
        // Close all other open voter sections
        document.querySelectorAll('.result-main.open').forEach(openEl => {
          if (openEl !== el) {
            openEl.classList.remove('open');
            openEl.nextElementSibling.style.display = 'none';
          }
        });
      }

      voters.style.display = isOpen ? 'none' : 'block';
      el.classList.toggle('open', !isOpen);
    }


    function logout() {
      clearSession();
      window.location.href = 'index.html';
    }

    loadResults();
  </script>
</body>
</html>

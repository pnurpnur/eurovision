<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FF006B">
  <meta name="description" content="Eurovision voting app - Score and rank your favorite songs">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eurovision">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="manifest" href="manifest.json">
  <title>Sangene - Eurovision 🎵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menuContainer"></div>

  <div class="container">

    <div class="songs-container">
      <div class="song-card-wrapper">
        <div id="songCard" class="swipe-card"></div>
      </div>

      <!-- Song selector menu at bottom -->
      <div class="song-selector">
        <div class="selector-scroll" id="selectorScroll"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.href = 'index.html';
    }

    const session = getSession();

    let songs = [];
    let ratings = {};
    let currentIndex = 0;
    let currentScoreMethod = getStoredScoreMethod();
    let touchStartX = 0;
    let touchEndX = 0;

    async function loadSongs() {
      try {
        songs = await apiCall('/songs');
        ratings = {};

        const myRatings = await apiCall(`/my-ratings?sessionId=${session.sessionId}`);
        myRatings.forEach(r => {
          ratings[r.songId] = {
            score: r.score,
            scoreMethod: r.scoreMethod,
            notes: r.notes
          };
        });

        // Don't override the score method from localStorage - keep user's current choice
        // The ratings are stored normalized, so they convert correctly regardless of method

        renderSongSelector();
        renderCurrentSong();
        setupSwipeListeners();
      } catch (error) {
        showMessage(`Feil: ${error.message}`, 'error');
      }
    }

    function generateScoreInput(rating) {
      const displayScore = rating.score !== undefined
        ? convertScore(rating.score, 'normalized', currentScoreMethod)
        : null;

      if (currentScoreMethod === '1-10') {
        const sliderValue = displayScore !== null ? displayScore : '1';
        const displayVal = displayScore !== null ? displayScore : '';
        return `
          <div class="slider-wrapper">
            <div class="slider-value-display">${displayVal}</div>
            <input type="range" min="1" max="10" class="score-input score-slider" value="${sliderValue}">
          </div>
        `;
      } else if (currentScoreMethod === 'dice') {
        const diceSVGs = {
          1: '<svg viewBox="0 0 24 24" class="dice-svg"><rect x="2" y="2" width="20" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
          2: '<svg viewBox="0 0 24 24" class="dice-svg"><rect x="2" y="2" width="20" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="17" cy="17" r="1.5" fill="currentColor"/></svg>',
          3: '<svg viewBox="0 0 24 24" class="dice-svg"><rect x="2" y="2" width="20" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="17" cy="17" r="1.5" fill="currentColor"/></svg>',
          4: '<svg viewBox="0 0 24 24" class="dice-svg"><rect x="2" y="2" width="20" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="17" cy="7" r="1.5" fill="currentColor"/><circle cx="7" cy="17" r="1.5" fill="currentColor"/><circle cx="17" cy="17" r="1.5" fill="currentColor"/></svg>',
          5: '<svg viewBox="0 0 24 24" class="dice-svg"><rect x="2" y="2" width="20" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="17" cy="7" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="7" cy="17" r="1.5" fill="currentColor"/><circle cx="17" cy="17" r="1.5" fill="currentColor"/></svg>',
          6: '<svg viewBox="0 0 24 24" class="dice-svg"><rect x="2" y="2" width="20" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="7" cy="12" r="1.5" fill="currentColor"/><circle cx="7" cy="17" r="1.5" fill="currentColor"/><circle cx="17" cy="7" r="1.5" fill="currentColor"/><circle cx="17" cy="12" r="1.5" fill="currentColor"/><circle cx="17" cy="17" r="1.5" fill="currentColor"/></svg>'
        };
        const buttons = [1, 2, 3, 4, 5, 6].map(num => {
          const activeClass = displayScore === num ? ' active' : '';
          return `<button type="button" class="score-button${activeClass}" data-score="${num}">${diceSVGs[num]}</button>`;
        }).join('');
        return `<div class="score-buttons-group">${buttons}</div>`;
      } else if (currentScoreMethod === 'scale') {
        const scaleButtons = [
          { label: '−−', value: -2 },
          { label: '−', value: -1 },
          { label: 'N', value: 0 },
          { label: '+', value: 1 },
          { label: '++', value: 2 }
        ];
        const buttons = scaleButtons.map(btn => {
          const activeClass = displayScore === btn.value ? ' active' : '';
          return `<button type="button" class="score-button${activeClass}" data-score="${btn.value}">${btn.label}</button>`;
        }).join('');
        return `<div class="score-buttons-group">${buttons}</div>`;
      }
      return '';
    }

    function renderCurrentSong() {
      if (!songs || songs.length === 0) return;

      const song = songs[currentIndex];
      if (!song || !song.id) return;

      const rating = ratings[song.id] || {};
      const scoreInput = generateScoreInput(rating);

      const card = document.getElementById('songCard');
      card.innerHTML = `
        <div class="song-number">#${song.number}</div>

        ${song.imageUrl ? `<img src="${song.imageUrl}" alt="${song.country}" class="song-image-large">` : '<div class="song-image-large"></div>'}

        <div class="song-details">
          <h2>${song.country}</h2>
          <p class="artist">${song.artist}</p>
          <p class="title">${song.title}</p>
        </div>

        <div class="song-form">
          <div class="form-group">
            <label>Score</label>
            ${scoreInput}
          </div>

          <div class="form-group">
            <label>Notater</label>
            <textarea class="notes-input" placeholder="Dine notater...">${rating.notes || ''}</textarea>
          </div>
        </div>
      `;

      attachEventListeners(song);
    }

    function renderSongSelector() {
      const selector = document.getElementById('selectorScroll');
      selector.innerHTML = '';

      songs.forEach((song, idx) => {
        const btn = document.createElement('button');
        btn.className = `selector-btn ${idx === currentIndex ? 'active' : ''}`;
        btn.textContent = song.number;
        btn.onclick = () => goToSong(idx);
        selector.appendChild(btn);
      });
    }

    function goToSong(index) {
      goToSongWithAnimation(index);
    }

    function nextSong() {
      const card = document.getElementById('songCard');
      card.classList.add('swipe-out-left');
      setTimeout(() => {
        currentIndex = (currentIndex + 1) % songs.length;
        card.classList.remove('swipe-out-left');
        card.classList.add('swipe-in-from-right');
        renderCurrentSong();
        renderSongSelector();
        scrollToActiveButton();
        setTimeout(() => card.classList.remove('swipe-in-from-right'), 400);
      }, 400);
    }

    function previousSong() {
      const card = document.getElementById('songCard');
      card.classList.add('swipe-out-right');
      setTimeout(() => {
        currentIndex = (currentIndex - 1 + songs.length) % songs.length;
        card.classList.remove('swipe-out-right');
        card.classList.add('swipe-in-from-left');
        renderCurrentSong();
        renderSongSelector();
        scrollToActiveButton();
        setTimeout(() => card.classList.remove('swipe-in-from-left'), 400);
      }, 400);
    }

    function scrollToActiveButton() {
      const activeButton = document.querySelector('.selector-scroll').children[currentIndex];
      if (activeButton) {
        activeButton.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }

    function attachEventListeners(song) {
      if (!song || !song.id) return;

      const notesInput = document.querySelector('.notes-input');
      if (!notesInput) return;

      // Helper function to save score (has access to song via closure)
      const saveScore = (scoreValue) => {
        // Send raw score to backend - let backend handle normalization
        const normalizedForDisplay = normalizeScore(scoreValue || 0, currentScoreMethod);

        ratings[song.id] = { score: normalizedForDisplay, scoreMethod: currentScoreMethod, notes: notesInput.value };

        apiCall('/ratings', 'POST', {
          sessionId: session.sessionId,
          songId: song.id,
          score: scoreValue || 0,  // Send raw score, not normalized
          scoreMethod: currentScoreMethod,
          notes: notesInput.value
        }).catch(error => {
          showMessage(`Feil: ${error.message}`, 'error');
        });
      };

      // Handle different score input types
      if (currentScoreMethod === '1-10') {
        const slider = document.querySelector('.score-slider');
        const display = document.querySelector('.slider-value-display');

        if (slider && display) {
          slider.addEventListener('input', () => {
            display.textContent = slider.value;
          });
          slider.addEventListener('change', () => {
            saveScore(slider.value);
          });
        }
      } else {
        // For dice and scale methods, use button clicks
        const buttons = document.querySelectorAll('.score-button');
        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            // Remove active class from all buttons
            buttons.forEach(b => b.classList.remove('active'));
            // Add active class to clicked button
            btn.classList.add('active');
            // Save the score
            saveScore(btn.dataset.score);
          });
        });
      }

      // Notes input listener
      notesInput.addEventListener('change', async () => {
        const scoreInput = document.querySelector('.score-input');
        const scoreValue = currentScoreMethod === '1-10'
          ? scoreInput?.value
          : document.querySelector('.score-button.active')?.dataset.score || 0;

        await saveScore(scoreValue);
      });
    }

    function setupSwipeListeners() {
      const card = document.getElementById('songCard');

      card.addEventListener('touchstart', (e) => {
        // Don't track swipe if touching slider or score buttons
        if (isInteractiveElement(e.target)) {
          touchStartX = null;
          return;
        }
        touchStartX = e.changedTouches[0].screenX;
      }, false);

      card.addEventListener('touchend', (e) => {
        // Don't swipe if we didn't properly start
        if (touchStartX === null) {
          return;
        }
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, false);
    }

    function isInteractiveElement(element) {
      // Check if element is a slider or button (disable swipe on these)
      if (element.classList.contains('score-slider') ||
          element.classList.contains('score-button')) {
        return true;
      }
      // Check if element is inside a slider-wrapper or score-buttons-group
      return element.closest('.slider-wrapper, .score-buttons-group') !== null;
    }

    function handleSwipe() {
      const diffThreshold = 50;
      const diff = touchStartX - touchEndX;

      if (Math.abs(diff) > diffThreshold) {
        if (diff > 0) {
          nextSong(); // Swiped left
        } else {
          previousSong(); // Swiped right
        }
      }
    }

    function goToSongWithAnimation(index) {
      if (index === currentIndex) return;

      const direction = index > currentIndex ? 'left' : 'right';
      const card = document.getElementById('songCard');

      if (direction === 'left') {
        card.classList.add('swipe-out-left');
      } else {
        card.classList.add('swipe-out-right');
      }

      setTimeout(() => {
        currentIndex = index;
        card.classList.remove('swipe-out-left', 'swipe-out-right');
        card.classList.add(direction === 'left' ? 'swipe-in-from-right' : 'swipe-in-from-left');
        renderCurrentSong();
        renderSongSelector();
        document.querySelector('.selector-scroll').children[index].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        setTimeout(() => card.classList.remove('swipe-in-from-right', 'swipe-in-from-left'), 400);
      }, 400);
    }

    function logout() {
      clearSession();
      window.location.href = 'index.html';
    }

    // Listen for score method changes from menu
    window.addEventListener('scoreMethodChanged', (e) => {
      const oldMethod = currentScoreMethod;
      const newMethod = e.detail.method;
      currentScoreMethod = newMethod;

      // Re-render current song to update score display
      const song = songs[currentIndex];
      if (song) {
        const scoreInput = document.querySelector('.score-input');
        if (scoreInput && scoreInput.value) {
          const normalized = normalizeScore(scoreInput.value, oldMethod);
          const converted = convertScore(normalized, 'normalized', newMethod);
          scoreInput.value = converted;
        }
        renderCurrentSong();
      }
    });

    loadSongs();
  </script>
</body>
</html>

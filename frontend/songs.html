<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sangene - Eurovision 🎵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="main-header">
    <div class="header-content">
      <div class="logo-section">
        <img src="logo.svg" alt="Eurovision" class="logo">
        <h1>Eurovision 2026</h1>
      </div>
      <div class="user-info">
        <button onclick="logout()" class="logout-btn">Logg ut</button>
      </div>
    </div>
  </header>

  <div class="container">
    <nav>
      <a href="songs.html" class="active">Sangene</a>
      <a href="myPoints.html">Mine poeng</a>
      <a href="results.html">Resultat</a>
    </nav>

    <div class="songs-container">
      <div class="song-card-wrapper">
        <div id="songCard" class="swipe-card"></div>
      </div>

      <!-- Song selector menu at bottom -->
      <div class="song-selector">
        <div class="selector-scroll" id="selectorScroll"></div>
      </div>

      <!-- Navigation buttons -->
      <div class="song-nav">
        <button onclick="previousSong()" class="nav-btn">← Forrige</button>
        <span id="songCounter" class="song-counter">1 / 25</span>
        <button onclick="nextSong()" class="nav-btn">Neste →</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.href = 'index.html';
    }

    const session = getSession();
    let songs = [];
    let ratings = {};
    let currentIndex = 0;
    let currentScoreMethod = getStoredScoreMethod();
    let touchStartX = 0;
    let touchEndX = 0;

    async function loadSongs() {
      try {
        songs = await apiCall('/songs');
        ratings = {};

        const myRatings = await apiCall(`/my-ratings?sessionId=${session.sessionId}`);
        myRatings.forEach(r => {
          ratings[r.songId] = {
            score: r.score,
            scoreMethod: r.scoreMethod,
            notes: r.notes
          };
        });

        if (myRatings.length > 0) {
          currentScoreMethod = myRatings[0].scoreMethod;
          saveScoreMethod(currentScoreMethod);
        }

        renderSongSelector();
        renderCurrentSong();
        setupSwipeListeners();
      } catch (error) {
        showMessage(`Feil: ${error.message}`, 'error');
      }
    }

    function renderCurrentSong() {
      const song = songs[currentIndex];
      const rating = ratings[song.id] || {};
      const displayScore = rating.score !== undefined
        ? convertScore(rating.score, 'normalized', currentScoreMethod)
        : '';

      const card = document.getElementById('songCard');
      card.innerHTML = `
        <div class="song-number">#${song.number}</div>

        ${song.imageUrl ? `<img src="${song.imageUrl}" alt="${song.country}" class="song-image-large">` : '<div class="song-image-large"></div>'}

        <div class="song-details">
          <h2>${song.country}</h2>
          <p class="artist">${song.artist}</p>
          <p class="title">${song.title}</p>
        </div>

        <div class="song-form">
          <div class="form-group">
            <label>Score-metode</label>
            <div class="score-method-buttons">
              <button type="button" class="method-btn ${currentScoreMethod === '1-10' ? 'active' : ''}" data-method="1-10">1-10</button>
              <button type="button" class="method-btn ${currentScoreMethod === 'dice' ? 'active' : ''}" data-method="dice">🎲</button>
              <button type="button" class="method-btn ${currentScoreMethod === 'scale' ? 'active' : ''}" data-method="scale">±</button>
            </div>
            <input type="text" class="score-input" placeholder="Score..." value="${displayScore}">
          </div>

          <div class="form-group">
            <label>Notater</label>
            <textarea class="notes-input" placeholder="Dine private notater...">${rating.notes || ''}</textarea>
          </div>
        </div>
      `;

      updateCounter();
      attachEventListeners(song);
    }

    function renderSongSelector() {
      const selector = document.getElementById('selectorScroll');
      selector.innerHTML = '';

      songs.forEach((song, idx) => {
        const btn = document.createElement('button');
        btn.className = `selector-btn ${idx === currentIndex ? 'active' : ''}`;
        btn.textContent = song.number;
        btn.onclick = () => goToSong(idx);
        selector.appendChild(btn);
      });
    }

    function updateCounter() {
      document.getElementById('songCounter').textContent = `${currentIndex + 1} / ${songs.length}`;
    }

    function goToSong(index) {
      currentIndex = index;
      renderCurrentSong();
      renderSongSelector();
      document.querySelector('.selector-scroll').children[index].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    function nextSong() {
      currentIndex = (currentIndex + 1) % songs.length;
      renderCurrentSong();
      renderSongSelector();
    }

    function previousSong() {
      currentIndex = (currentIndex - 1 + songs.length) % songs.length;
      renderCurrentSong();
      renderSongSelector();
    }

    function attachEventListeners(song) {
      document.querySelectorAll('.method-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const oldMethod = currentScoreMethod;
          const newMethod = btn.dataset.method;

          document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          currentScoreMethod = newMethod;
          saveScoreMethod(newMethod);

          const scoreInput = document.querySelector('.score-input');
          if (scoreInput.value) {
            const normalized = normalizeScore(scoreInput.value, oldMethod);
            const converted = convertScore(normalized, 'normalized', newMethod);
            scoreInput.value = converted;
          }
        });
      });

      document.querySelector('.score-input').addEventListener('change', async () => {
        const scoreInput = document.querySelector('.score-input');
        const notesInput = document.querySelector('.notes-input');
        const score = normalizeScore(scoreInput.value || 0, currentScoreMethod);

        ratings[song.id] = { score, scoreMethod: currentScoreMethod, notes: notesInput.value };

        try {
          await apiCall('/ratings', 'POST', {
            sessionId: session.sessionId,
            songId: song.id,
            score,
            scoreMethod: currentScoreMethod,
            notes: notesInput.value
          });
        } catch (error) {
          showMessage(`Feil: ${error.message}`, 'error');
        }
      });

      document.querySelector('.notes-input').addEventListener('change', async () => {
        const scoreInput = document.querySelector('.score-input');
        const notesInput = document.querySelector('.notes-input');
        const score = normalizeScore(scoreInput.value || 0, currentScoreMethod);

        ratings[song.id] = { score, scoreMethod: currentScoreMethod, notes: notesInput.value };

        try {
          await apiCall('/ratings', 'POST', {
            sessionId: session.sessionId,
            songId: song.id,
            score,
            scoreMethod: currentScoreMethod,
            notes: notesInput.value
          });
        } catch (error) {
          showMessage(`Feil: ${error.message}`, 'error');
        }
      });
    }

    function setupSwipeListeners() {
      const card = document.getElementById('songCard');

      card.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, false);

      card.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, false);
    }

    function handleSwipe() {
      const diffThreshold = 50;
      const diff = touchStartX - touchEndX;

      if (Math.abs(diff) > diffThreshold) {
        if (diff > 0) {
          nextSong(); // Swiped left
        } else {
          previousSong(); // Swiped right
        }
      }
    }

    function logout() {
      clearSession();
      window.location.href = 'index.html';
    }

    loadSongs();
  </script>
</body>
</html>
